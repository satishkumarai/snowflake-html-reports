[project]
name = "snowflake-html-reports"
version = "0.1.0"
description = "Validation and governance tooling for Snowflake HTML Report artifacts"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
validate-report = "scripts.validate_report:main"

[tool.setuptools]
packages = ["scripts"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
