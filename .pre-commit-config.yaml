repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks: [{ id: ruff }, { id: ruff-format }]
  - repo: local
    hooks:
      - id: validate-report
        name: validate HTML reports
        entry: python scripts/validate_report.py
        language: system
        files: ^reports/.*\.html$
